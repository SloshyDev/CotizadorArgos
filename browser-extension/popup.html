<!doctype html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cotizador Argos</title><link rel="stylesheet" href="popup.css"></head>
<body><main class="app"><header><div class="logo">A</div><div><h1>Cotizador Argos</h1><p>Protección por fallecimiento</p></div></header>
<section class="card"><label for="nombre">Nombre <span>(opcional)</span></label><input id="nombre" placeholder="Nombre completo">
<div class="mode"><button id="edadMode" class="active" type="button">Edad</button><button id="rfcMode" type="button">RFC</button></div>
<div id="ageField"><label for="edad">Edad</label><input id="edad" type="number" min="50" max="70" placeholder="50 a 70 años"></div>
<div id="rfcField" hidden><label for="rfc">RFC</label><input id="rfc" maxlength="13" placeholder="GODE561231GR8"><p class="hint">Se calcula con la fecha del RFC.</p></div>
<p id="error" class="error" role="alert"></p><button id="quote" class="primary" type="button">Calcular cotización</button></section>
<section id="result" class="card result" hidden><div class="summary"><div><p class="overline">COTIZACIÓN PARA</p><h2 id="person"></h2><p id="ageResult"></p></div><button id="download" class="download" type="button">PDF</button></div><div id="plans" class="plans"></div><p class="disclaimer">Importes en moneda nacional. Cotización informativa, sujeta a condiciones y aprobación aplicables.</p></section>
</main><script src="vendor/jspdf.umd.min.js"></script><script src="popup.js"></script></body></html>
