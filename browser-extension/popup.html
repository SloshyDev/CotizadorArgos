<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotizador Argos</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header>
      <img class="brand-icon" src="assets/certeza-icon.svg" alt="Certeza">
      <div><h1>Cotizador</h1><p>Certeza × Seguros Argos</p></div>
    </header>

    <section class="hero">
      <img src="assets/proteccion-familiar.jpg" alt="Familia protegida">
      <div><span>PROTECCIÓN FAMILIAR</span><strong>Seguro por<br>fallecimiento</strong></div>
    </section>

    <section class="form-card">
      <label for="nombre">Nombre <span>(opcional)</span></label>
      <input id="nombre" placeholder="Nombre completo">

      <div class="mode">
        <button id="edadMode" class="active" type="button">Edad</button>
        <button id="rfcMode" type="button">RFC</button>
      </div>

      <div id="ageField"><label for="edad">Edad</label><input id="edad" type="number" min="50" max="70" placeholder="50 a 70 años"></div>
      <div id="rfcField" hidden><label for="rfc">RFC</label><input id="rfc" maxlength="13" placeholder="GODE561231GR8"><p class="hint">Acepta RFC con o sin homoclave.</p></div>

      <p id="error" class="error" role="alert"></p>
      <button id="quote" class="primary" type="button">Generar cotización PDF</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
